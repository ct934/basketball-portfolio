<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2027 NBA Draft Prospect Scouting Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="scroll-progress" id="scrollProgress"></div>
  <header class="draft-header">
    <div class="container nav-wrap">
      <a class="draft-brand" href="./index.html" title="Back to Chinh Tong's portfolio">CT</a>
      <a class="draft-title" href="./nba-2027-draft-scouting.html">
        <span><b>2027</b> NBA Draft Prospect Scouting Profile</span>
      </a>
      <div class="draft-actions">
        <a href="./admin.html" aria-label="Profile / Log in" title="Profile / Log in"><img src="./assets/images/profile.webp" alt="Profile"></a>
        <a href="https://www.linkedin.com/in/chinhtong/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn" title="LinkedIn"><img src="./assets/images/linkedin.png" alt="LinkedIn"></a>
        <a href="mailto:chinhtv1712@gmail.com" aria-label="Email" title="Email"><img src="./assets/images/email.png" alt="Email"></a>
        <a href="tel:+15179802253" aria-label="Phone" title="Phone"><img src="./assets/images/phone.webp" alt="Phone"></a>
        <a href="https://x.com/TVC_Scouting" target="_blank" rel="noopener noreferrer" aria-label="X" title="X"><img src="./assets/images/x.webp" alt="X"></a>
      </div>
    </div>
  </header>

  <section class="draft-hero">
    <div class="container">
      <p>Select a prospect to open their scouting log, then open any entry to read the full report.</p>
    </div>
  </section>

  <main class="section">
    <div class="container">

      <div class="board-controls">
        <input id="prospectSearch" class="board-search" type="search"
               placeholder="Search name, position, school, class, or projection…"
               autocomplete="off" aria-label="Search prospects">
        <div class="view-toggle" role="group" aria-label="View mode">
          <button id="viewGridBtn" type="button" aria-pressed="true">▦ Grid</button>
          <button id="viewListBtn" type="button" aria-pressed="false">☰ List</button>
        </div>
      </div>

      <div id="prospectContainer" class="project-grid"></div>

      <p style="margin-top: 1.5rem;">
        <a class="btn btn-ghost" href="./projects.html">Back to Projects</a>
      </p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="year"></span> Chinh Tong. All rights reserved.</p>
    </div>
  </footer>

  <script src="./script.js"></script>
  <script src="./2027-nba-draft-prospects/roster.js"></script>
  <script type="module">
    import { db } from "./firebase-init.js";
    import { collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // Fallback projections (from each player's preseason report) so the board
    // still shows Draft / NBA columns even before the database is reached.
    const PROJECTIONS = {
  "anthony-thompson": {
    "draft": "Second Round",
    "role": "Bench Player"
  },
  "babatunde-oladotun": {
    "draft": "Late Lottery – Early 20s",
    "role": "High-End Rotation Player"
  },
  "brandon-mccoy": {
    "draft": "Top 8",
    "role": "Fringe All-Star"
  },
  "braylon-mullins": {
    "draft": "Draft Follow",
    "role": "Role Projection TBD"
  },
  "bruce-branch-iii": {
    "draft": "Top 10",
    "role": "Fringe All-Star"
  },
  "caleb-holt": {
    "draft": "Top 5",
    "role": "All-Star Potential"
  },
  "cameron-williams": {
    "draft": "Lottery",
    "role": "High-End Rotation Player"
  },
  "christian-collins": {
    "draft": "Draft Follow",
    "role": "Role Projection TBD"
  },
  "dame-sarr": {
    "draft": "Draft Follow",
    "role": "Role Projection TBD"
  },
  "jason-crowe-jr": {
    "draft": "Lottery",
    "role": "High-End Sixth Man"
  },
  "jordan-smith-jr": {
    "draft": "Top 5",
    "role": "All-Star Potential"
  },
  "luigi-suigo": {
    "draft": "Top 8",
    "role": "All-Star Potential"
  },
  "miikka-muurinen": {
    "draft": "Lottery",
    "role": "Fringe All-Star"
  },
  "stefan-joksimovic": {
    "draft": "Top 5",
    "role": "All-Star Potential"
  },
  "trey-mckenney-jr": {
    "draft": "Draft Follow",
    "role": "Role Projection TBD"
  },
  "tyran-stokes": {
    "draft": "Top 3",
    "role": "All-NBA Potential"
  }
};

    const roster = window.ROSTER || [];
    const box = document.getElementById("prospectContainer");
    const btnGrid = document.getElementById("viewGridBtn");
    const btnList = document.getElementById("viewListBtn");
    const searchInput = document.getElementById("prospectSearch");
    let latest = {};                 // slug -> {draft, role, date} from Firestore
    let board = null;                // {ranked:[], na:[]} from meta/board
    let view = localStorage.getItem("draft2027View") || "grid";
    let filterText = "";             // live search query (lower-cased)

    function esc(x){ return String(x==null?"":x)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

    function projFor(slug){
      const l = latest[slug];
      if (l && (l.draft || l.role)) return { draft: l.draft, role: l.role };
      return PROJECTIONS[slug] || { draft: "", role: "" };
    }
    function classLabel(p){
      const c = (p.playerClass || "").toLowerCase();
      return (!c || c === "intl") ? "NA" : p.playerClass;
    }
    function hrefFor(p){ return `./2027-nba-draft-prospects/${p.slug}/${p.slug}.html`; }
    function imgFor(p){ return p.image ? `./assets/images/${esc(p.image)}` : ""; }

    // Searchable haystack per player: name + all info + projections.
    function matches(e){
      if (!filterText) return true;
      const p = e.p, pr = projFor(p.slug);
      const hay = [p.name, p.position, p.school, classLabel(p), pr.draft, pr.role]
        .join(" ").toLowerCase();
      return hay.includes(filterText);
    }

    // Order players by the saved board ranking: ranked (1..n) then NA.
    // Any roster player not placed in the board defaults to the end of ranked.
    function orderedRoster(){
      const bySlug = Object.fromEntries(roster.map((p) => [p.slug, p]));
      const all = roster.map((p) => p.slug);
      let ranked = (board && Array.isArray(board.ranked)) ? board.ranked.filter((s)=>bySlug[s]) : [];
      let na = (board && Array.isArray(board.na)) ? board.na.filter((s)=>bySlug[s] && !ranked.includes(s)) : [];
      // Any player not explicitly ranked defaults to NA (not yet scouted).
      all.forEach((s)=>{ if (!ranked.includes(s) && !na.includes(s)) na.push(s); });
      const out = [];
      ranked.forEach((s, i) => out.push({ p: bySlug[s], rank: i + 1 }));
      na.forEach((s) => out.push({ p: bySlug[s], rank: "NA" }));
      return out;
    }

    function render(){
      const items = orderedRoster().filter(matches);
      if (!items.length){
        box.className = "";
        box.innerHTML = '<p class="board-empty">No prospects match “' + esc(filterText) + '”.</p>';
        btnGrid.classList.toggle("active", view === "grid");
        btnList.classList.toggle("active", view === "list");
        return;
      }
      if (view === "list"){
        box.className = "prospect-list";
        box.innerHTML = items.map(({ p, rank }) => {
          const pr = projFor(p.slug);
          const rankClass = rank === "NA" ? "prospect-rank prospect-rank-na" : "prospect-rank";
          return `
            <a class="prospect-row" href="${hrefFor(p)}">
              <span class="${rankClass}">${esc(rank)}</span>
              <img class="prospect-row-img" src="${imgFor(p)}" alt="${esc(p.name)}" loading="lazy">
              <div class="prospect-row-main">
                <span class="prospect-row-name">${esc(p.name)}</span>
                <span class="prospect-row-sub">${esc(p.position)} &middot; ${esc(p.school)} &middot; ${esc(classLabel(p))}</span>
              </div>
              <div class="prospect-row-proj">
                <span class="prospect-row-proj-item"><small>Draft</small>${esc(pr.draft || "—")}</span>
                <span class="prospect-row-proj-item"><small>NBA</small>${esc(pr.role || "—")}</span>
              </div>
            </a>`;
        }).join("");
      } else {
        box.className = "project-grid";
        box.innerHTML = items.map(({ p }) => `
            <a class="project-card in-view" href="${hrefFor(p)}">
              <img src="${imgFor(p)}" alt="${esc(p.name)} scouting log" loading="lazy">
              <div class="meta"><h4>${esc(p.name)}</h4><p>${esc(p.position)} &middot; ${esc(p.school)}</p></div>
            </a>`).join("");
      }
      btnGrid.classList.toggle("active", view === "grid");
      btnList.classList.toggle("active", view === "list");
      btnGrid.setAttribute("aria-pressed", view === "grid");
      btnList.setAttribute("aria-pressed", view === "list");
    }

    btnGrid.addEventListener("click", () => { view = "grid"; localStorage.setItem("draft2027View", view); render(); });
    btnList.addEventListener("click", () => { view = "list"; localStorage.setItem("draft2027View", view); render(); });
    searchInput.addEventListener("input", (e) => { filterText = e.target.value.trim().toLowerCase(); render(); });

    render(); // immediate paint with roster order + fallback projections

    // Load the saved board ranking (order + NA), then re-render.
    (async () => {
      try {
        const snap = await getDoc(doc(db, "meta", "board"));
        if (snap.exists()) board = snap.data();
        render();
      } catch (e) { console.error("Could not load board ranking:", e); }
    })();

    // Upgrade Draft/NBA columns with the latest report per player.
    (async () => {
      try {
        const snap = await getDocs(collection(db, "reports"));
        const by = {};
        snap.forEach((d) => {
          const r = d.data(); const slug = r.playerSlug;
          if (!slug) return;
          if (!by[slug] || (r.date || "") > (by[slug].date || "")) {
            by[slug] = { draft: r.draftProjection, role: r.roleProjection, date: r.date };
          }
        });
        latest = by;
        render();
      } catch (e) { console.error("Could not load latest projections:", e); }
    })();
  </script>
</body>
</html>
