<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scouting Report | Chinh Tong</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="scroll-progress" id="scrollProgress"></div>
  <header class="draft-header">
    <div class="container nav-wrap">
      <a class="draft-brand" href="./index.html" title="Back to Chinh Tong's portfolio">CT</a>
      <a class="draft-title" href="./nba-2027-draft-scouting.html">
        <span><b>2027</b> NBA Draft Prospect Scouting Profile</span>
      </a>
      <div class="draft-actions">
        <a href="./admin.html" aria-label="Profile / Log in" title="Profile / Log in"><img src="./assets/images/profile.webp" alt="Profile"></a>
        <a href="https://www.linkedin.com/in/chinhtong/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn" title="LinkedIn"><img src="./assets/images/linkedin.png" alt="LinkedIn"></a>
        <a href="mailto:chinhtv1712@gmail.com" aria-label="Email" title="Email"><img src="./assets/images/email.png" alt="Email"></a>
        <a href="tel:+15179802253" aria-label="Phone" title="Phone"><img src="./assets/images/phone.webp" alt="Phone"></a>
        <a href="https://x.com/TVC_Scouting" target="_blank" rel="noopener noreferrer" aria-label="X" title="X"><img src="./assets/images/x.webp" alt="X"></a>
      </div>
    </div>
  </header>

  <main class="section">
    <div class="container panel scouting-report" id="reportRoot">
      <p class="report-line" style="opacity:0.6;">Loading report…</p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="year"></span> Chinh Tong. All rights reserved.</p>
    </div>
  </footer>

  <script src="./2027-nba-draft-prospects/roster.js"></script>
  <script type="module">
    import { db } from "./firebase-init.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const y = document.getElementById("year");
    if (y) y.textContent = new Date().getFullYear();

    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
    function para(txt) {
      // preserve line breaks the author typed
      return esc(txt).replace(/\n/g, "<br>");
    }

    const params = new URLSearchParams(location.search);
    const id = params.get("id");
    const root = document.getElementById("reportRoot");

    function rosterFor(slug) {
      return (window.ROSTER || []).find((p) => p.slug === slug) || {};
    }

    async function load() {
      if (!id) { root.innerHTML = '<p class="report-line">No report specified.</p>'; return; }
      try {
        const snap = await getDoc(doc(db, "reports", id));
        if (!snap.exists()) { root.innerHTML = '<p class="report-line">Report not found.</p>'; return; }
        const r = snap.data();
        const p = rosterFor(r.playerSlug);
        const img = p.image ? `./assets/images/${p.image}` : "";
        const kicker = `2027 NBA Draft &middot; ${esc(r.title)} &middot; ${esc(r.dateLabel || r.date)}`;
        const backLog = `./2027-nba-draft-prospects/${encodeURIComponent(r.playerSlug)}/${encodeURIComponent(r.playerSlug)}.html`;
        document.title = `${r.playerName} — ${r.title} | Chinh Tong`;

        const statsBlock = r.stats
          ? `<section class="report-section"><h2>Stats</h2><p class="report-line" style="opacity:0.6;">${para(r.stats)}</p></section>`
          : "";

        root.innerHTML = `
          <div class="report-hero">
            <div>
              <p class="hero-kicker">${kicker}</p>
              <h1>${esc(r.playerName)}</h1>
              <p class="lead">${esc(r.lead || p.physicalDefault || "")}</p>
            </div>
            <figure class="report-photo">
              ${img ? `<img src="${img}" alt="${esc(r.playerName)} scouting report">` : ""}
            </figure>
          </div>

          <div class="report-section-grid">
            <section class="report-section">
              <h2>Draft Projection</h2>
              <div class="tag-row"><span class="tag">${esc(r.draftProjection)}</span></div>
            </section>
            <section class="report-section">
              <h2>NBA Role Projection</h2>
              <div class="tag-row"><span class="tag tag-role">${esc(r.roleProjection)}</span></div>
            </section>
            ${statsBlock}
            <section class="report-section">
              <h2>Info</h2>
              <p class="report-line">${para(r.info || p.physicalDefault || "")}</p>
            </section>
            <section class="report-section">
              <h2>Physical</h2>
              <p class="report-body">${para(r.physical)}</p>
            </section>
            <section class="report-section">
              <h2>Offense</h2>
              <p class="report-body">${para(r.offense)}</p>
            </section>
            <section class="report-section">
              <h2>Defense</h2>
              <p class="report-body">${para(r.defense)}</p>
            </section>
            <section class="report-section">
              <h2>Outlook</h2>
              <p class="report-body">${para(r.outlook)}</p>
            </section>
          </div>

          <div class="report-nav">
            <a class="btn btn-ghost" href="${backLog}">Back to Report Log</a>
            <a class="btn btn-ghost" href="./nba-2027-draft-scouting.html">Back to Prospect Board</a>
          </div>`;
      } catch (err) {
        console.error(err);
        root.innerHTML = '<p class="report-line">Could not load this report right now.</p>';
      }
    }
    load();
  </script>
</body>
</html>
