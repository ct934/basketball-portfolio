<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Player Snapshot</title>
  <link rel="stylesheet" href="/cbb-hub/hub.css?v=20260922-statebox1">
</head>
<body class="hub-body">
  <main class="hub-shell">
    <header class="hub-topbar">
      <div>
        <h1>VERSPID</h1>
      </div>
      <nav class="hub-nav" aria-label="Hub navigation">
        <a href="/cbb-hub/index.html">Players</a>
        <a href="/cbb-hub/board-builder.html">Boards</a>
        <a href="/cbb-hub/team-builder.html">Team Builder</a>
        <a href="/cbb-hub/player-fit.html">Player Fit</a>
        <a id="comparisonNavLink" href="/cbb-hub/player-comparison.html">Compare</a>
        <a href="/cbb-hub/translation-insights.html">Translation Insights</a>
        <a href="/cbb-hub/rotation-replacement.html">Replacement</a>
        <a href="/cbb-hub/model-validation.html">Validation</a>
        <button id="exportProfile" class="export-btn hidden" type="button" title="Export the complete player snapshot as a PDF">Export snapshot</button>
      </nav>
      <div class="auth-box">
        <span id="authStatus">Checking access...</span>
        <button id="authBtn" type="button" class="hidden">Sign out</button>
      </div>
    </header>
    <section id="gate" class="gate-card">
      <h2>Private model access</h2>
      <p>Sign in to view player snapshots.</p>
      <form id="authForm" class="auth-form">
        <label class="auth-field"><span>Email</span><input id="authEmail" type="email" autocomplete="email" required></label>
        <label class="auth-field"><span>Password</span><input id="authPassword" type="password" autocomplete="current-password" required minlength="6"></label>
        <p id="authError" class="auth-error hidden"></p>
        <div class="auth-form-actions">
          <button id="authSubmit" type="submit" class="board-command primary">Sign in</button>
          <button id="authForgot" type="button" class="auth-link-button">Forgot password?</button>
        </div>
      </form>
      <p id="authPending" class="auth-pending hidden"></p>
      <p class="auth-switch">New here? <button id="authToggleMode" type="button" class="auth-link-button">Create an account</button></p>
    </section>
    <section id="profile" class="profile-grid hidden"></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script type="module" src="/cbb-hub/player.js?v=20260928-nbablend1"></script>
</body>
</html>
